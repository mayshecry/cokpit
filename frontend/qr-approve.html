<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit — confirm sign-in</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:radial-gradient(1200px 700px at 70% -10%, rgba(255,138,42,.10), transparent 60%), #101216;
         color:#e4e8ed; font:14px/1.55 "Segoe UI", system-ui, sans-serif; }
  .card { width:min(420px,92vw); background:#16191e; border:1px solid #262c34; border-radius:18px;
          padding:30px 34px 26px; box-shadow:0 24px 60px rgba(0,0,0,.45); }
  h1 { margin:0 0 6px; font-size:20px; }
  p.mut { color:#8a919b; font-size:13.5px; margin:0 0 20px; }
  .who { display:flex; align-items:center; gap:12px; background:#101216; border:1px solid #262c34;
         border-radius:13px; padding:13px 15px; margin-bottom:18px; }
  .who .bub { width:38px; height:38px; border-radius:999px; background:linear-gradient(140deg,#ff8a2a,#ff7a12);
              color:#1c1405; font:800 14px/38px inherit; text-align:center; flex:0 0 38px; }
  .who b { font-size:15px; display:block; }
  .who span { color:#8a919b; font-size:12px; }
  .row { display:flex; gap:10px; }
  button { flex:1; padding:12px; border:none; border-radius:11px; cursor:pointer; font:700 14px/1 inherit; }
  .ok { background:linear-gradient(140deg,#ff8a2a,#ff7a12); color:#1c1405; }
  .no { background:transparent; border:1px solid #3a3230; color:#c9cfd6; }
  .err { color:#f0655a; font-size:12.5px; min-height:18px; margin-top:14px; }
  .good { color:#4cc38a; }
  .foot { margin-top:18px; color:#676e78; font-size:11px; text-transform:uppercase;
          letter-spacing:.09em; text-align:center; }
</style>
</head>
<body>
  <div class="card">
    <h1>Confirm sign-in</h1>
    <p class="mut" id="lead">A device scanned your sign-in QR and asks to be signed in…</p>
    <div class="who" id="who" hidden>
      <div class="bub" id="bub">?</div>
      <div><b id="uname">…</b><span id="ureal">this is you</span></div>
    </div>
    <div class="row" id="row" hidden>
      <button type="button" class="no" id="reject">Reject</button>
      <button type="button" class="ok" id="approve">Sign in ✓</button>
    </div>
    <p class="err" id="msg"></p>
    <p class="foot">cockpit · qr sign-in</p>
  </div>
  <script src="/js/qrapprove.js"></script>
</body>
</html>
