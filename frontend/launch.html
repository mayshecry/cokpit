<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit — link this device</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:radial-gradient(1200px 700px at 70% -10%, rgba(255,138,42,.10), transparent 60%), #101216;
         color:#e4e8ed; font:14px/1.55 "Segoe UI", system-ui, sans-serif; }
  .card { width:min(420px,92vw); background:#16191e; border:1px solid #262c34; border-radius:18px;
          padding:30px 34px 26px; box-shadow:0 24px 60px rgba(0,0,0,.45); }
  h1 { margin:0 0 4px; font-size:20px; }
  p.mut { color:#8a919b; font-size:13px; margin:0 0 18px; }
  label { display:block; font:600 11px/1.4 inherit; color:#8a919b; text-transform:uppercase;
          letter-spacing:.08em; margin-bottom:6px; }
  input { width:100%; padding:12px 14px; border:1px solid #262c34; border-radius:11px; background:#101216;
          color:#e4e8ed; font:600 17px/1.2 "Cascadia Code", ui-monospace, monospace;
          letter-spacing:.14em; text-align:center; }
  input:focus { outline:none; border-color:#ff8a2a; box-shadow:0 0 0 3px rgba(255,138,42,.18); }
  button { width:100%; margin-top:16px; padding:12px; border:none; border-radius:11px; cursor:pointer;
           background:linear-gradient(140deg,#ff8a2a,#ff7a12); color:#1c1405; font:700 14px/1 inherit; }
  button:disabled { opacity:.5; cursor:default; }
  .err { color:#f0655a; font-size:12.5px; min-height:18px; margin-top:12px; }
  .ok { color:#4cc38a; }
  .foot { margin-top:18px; color:#676e78; font-size:11px; text-transform:uppercase;
          letter-spacing:.09em; text-align:center; }
  .spin { display:inline-block; width:13px; height:13px; border:2px solid rgba(228,232,237,.25);
          border-top-color:#ff8a2a; border-radius:50%; animation:s .7s linear infinite; vertical-align:-2px; }
  @keyframes s { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <div class="card" id="card">
    <h1>Cockpit</h1>
    <p class="mut" id="lead">One moment — linking this device…</p>
    <div id="form" hidden>
      <label for="code">Pairing code</label>
      <input id="code" maxlength="12" placeholder="1234-5678" inputmode="numeric" autocomplete="off" spellcheck="false">
      <button id="go" type="button">Link device</button>
    </div>
    <p class="err" id="msg"></p>
    <p class="foot">cockpit · device linking</p>
  </div>
  <script src="/js/launch.js"></script>
</body>
</html>
